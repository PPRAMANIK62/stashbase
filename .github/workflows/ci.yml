name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  source-build:
    name: Source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.3.0'
          node-manager: false
          run-install: false
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            tar
            xz
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nodejs
            mingw-w64-x86_64-pkgconf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vite+ inventory
        run: pnpm test:toolchain

      # One step, eleven gates: scripts/renderer/check-web.mjs runs
      # architecture, size, conventions, unused, duplication, format, lint,
      # coverage, typecheck, build, and the production-equivalent Storybook
      # build — each to completion — so lint, the renderer coverage gate, and
      # Storybook are already covered here and need no separate step.
      - name: Check supported renderer
        run: pnpm check:web

      - name: Test renderer packaging input
        run: pnpm test:package-inputs

      - name: Check test inventory wiring
        run: pnpm test:inventory

      - name: Install Python sidecar dependencies
        run: pnpm setup:python

      - name: Test Python sidecars
        run: pnpm test:python

      - name: Test release CI gate
        run: pnpm test:release-gate

      - name: Test macOS signing contract
        run: pnpm test:macos-signing

      - name: Test optional Windows signing contract
        run: pnpm test:windows-signing

      - name: Test desktop update contracts
        run: pnpm test:updates

      - name: Test application config and hosted account
        run: pnpm test:config

      - name: Test Electron window lifecycle
        run: npm run test:electron

      - name: Test conversion scheduler
        run: pnpm test:conversion-scheduler

      - name: Test library file transactions
        run: pnpm test:library-files

      - name: Test retrieval
        run: pnpm test:retrieval

      - name: Test agent adapters
        run: pnpm test:agent

      - name: Test bundled OpenCode runtime
        run: pnpm test:opencode:native

      - name: Test MCP transports
        run: pnpm test:mcp

      - name: Typecheck server + mcp + renderer
        run: pnpm typecheck

      - name: Build web + server
        run: pnpm build

      - name: Smoke real Electron app lifecycle (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:electron:smoke

      - name: Smoke real Electron app lifecycle (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm test:electron:smoke

      - name: Build Windows Python sidecars
        if: runner.os == 'Windows'
        run: pnpm build:python-extract-sidecar

      - name: Build Windows transcription sidecar
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-transcription-sidecar.sh

      - name: Build packaged Windows app
        if: runner.os == 'Windows'
        env:
          STASHBASE_REQUIRE_EXTRACT: '1'
          STASHBASE_SKIP_SIDECAR_BUILD: '1'
          STASHBASE_SKIP_TRANSCRIPTION_BUILD: '1'
        run: pnpm dist:win

      - name: Smoke packaged Windows server
        if: runner.os == 'Windows'
        env:
          STASHBASE_REQUIRE_EXTRACT: '1'
        run: node scripts/smoke-packaged-server.mjs --require-extract --require-transcription
